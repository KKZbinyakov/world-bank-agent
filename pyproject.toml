[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-insight-agent"
version = "0.1.0"
description = "Agentic analytics platform for World Bank indicators"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [
  { name = "WB Insight Agent Team" },
]
dependencies = [
  "httpx>=0.28.1,<1.0",
  "pandas>=2.2,<3.0",
  "pyarrow>=18,<24",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "PyYAML>=6.0.2,<7.0",
  "rich>=13.9,<15.0",
  "tenacity>=9.0,<10.0",
  "typer>=0.15,<1.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2.0",
  "mypy>=1.15,<3.0",
  "pre-commit>=4.0,<5.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.16.2,<1.0",
  "types-PyYAML>=6.0.12,<7.0",
]

[project.scripts]
wb-insight = "wb_insight.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wb_insight = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = "-ra --strict-config --strict-markers --cov=wb_insight --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["wb_insight"]
omit = ["src/wb_insight/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_configs = true
pretty = true
show_error_codes = true
