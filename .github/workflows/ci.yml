name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type-check production code
        run: python -m mypy src

      - name: Run unit tests with coverage
        run: python -m pytest -m "not integration"

      - name: Build distribution artifacts
        run: python -m build

  clickhouse-integration:
    name: ClickHouse integration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.7.1
        env:
          CLICKHOUSE_DB: wb_insight_ci
          CLICKHOUSE_USER: wb_insight
          CLICKHOUSE_PASSWORD: wb_insight_ci
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user wb_insight --password wb_insight_ci --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 10s

    env:
      APP_ENV: test
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: wb_insight_ci
      CLICKHOUSE_USER: wb_insight
      CLICKHOUSE_PASSWORD: wb_insight_ci
      CLICKHOUSE_SECURE: "false"
      RUN_CLICKHOUSE_INTEGRATION: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run live ClickHouse integration tests
        run: >-
          python -m pytest
          tests/integration/test_clickhouse_integration.py
          -m integration
          --no-cov
          -vv

      - name: Run ClickHouse smoke script
        run: python scripts/smoke_test_clickhouse.py

      - name: Run Tool API smoke script
        run: python scripts/smoke_test_api.py

      - name: Print ClickHouse logs after a failure
        if: failure()
        shell: bash
        run: |
          container_id="$(docker ps -aq --filter ancestor=clickhouse/clickhouse-server:26.7.1 | head -n 1)"
          if [[ -n "$container_id" ]]; then
            docker logs "$container_id"
          fi
