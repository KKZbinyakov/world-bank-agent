source_id: 2  # Default source for entries without an explicit source_id.

# Semantic registry for project metrics.
# This registry is an enrichment layer, not an allowlist: arbitrary World Bank
# indicators can still be requested explicitly. Registered indicators receive
# stable aliases, categories, Russian labels and display units.
#
# `enabled` only controls the default selection when --indicators is omitted.
