source_id: 2  # Default source for registry entries without an explicit source_id.

# This file is a semantic registry and the default indicator selection.
# It is NOT an allowlist: `wb-insight ingest --indicators CODE1,6:CODE2` may use
# indicators from any World Bank source. Each registry entry may override source_id.
# Unknown unqualified codes are auto-resolved only when exactly one source exposes
# them; ambiguous codes must be written as SOURCE_ID:INDICATOR_CODE.
# Missing units remain null instead of being guessed.
indicators:
  - code: NY.GDP.PCAP.CD
    alias: gdp_per_capita
    name_ru: ВВП на душу населения, текущие доллары США
    category: economy
    role: target
    enabled: true
    unit: current_usd_per_person
    display_unit: US$ / person

  - code: SP.POP.TOTL
    alias: population
    name_ru: Численность населения
    category: demographics
    role: context
    enabled: true
    unit: people
    display_unit: people

  - code: SP.URB.TOTL.IN.ZS
    alias: urban_population_share
    name_ru: Доля городского населения
    category: demographics
    role: feature
    enabled: true
    unit: percent_of_population
    display_unit: "%"

  - code: EG.ELC.ACCS.ZS
    alias: electricity_access
    name_ru: Доступ к электричеству
    category: infrastructure
    role: feature
    enabled: true
    unit: percent_of_population
    display_unit: "%"

  - code: EG.USE.ELEC.KH.PC
    alias: electricity_use_per_capita
    name_ru: Потребление электроэнергии на душу населения
    category: energy
    role: feature
    enabled: true
    unit: kwh_per_person
    display_unit: kWh / person

  - code: EN.GHG.CO2.MT.CE.AR5
    alias: co2_emissions
    name_ru: Выбросы CO2, всего, без LULUCF
    category: ecology
    role: feature
    enabled: true
    unit: mt_co2e
    display_unit: Mt CO2e

  - code: SE.XPD.TOTL.GD.ZS
    alias: education_expenditure_share
    name_ru: Государственные расходы на образование
    category: education
    role: feature
    enabled: true
    unit: percent_of_gdp
    display_unit: "% of GDP"

  - code: SE.ADT.LITR.ZS
    alias: adult_literacy_rate
    name_ru: Уровень грамотности взрослого населения
    category: education
    role: feature
    enabled: false
    unit: percent_of_population_age_15_plus
    display_unit: "%"
