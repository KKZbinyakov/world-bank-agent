# Derived metrics are evaluated after the wide mart is built.
# Only safe arithmetic over existing mart columns is supported.
derived_metrics:
  - name: employed_derived_total
    expression: "labor_force_total * (1 - unemployment_pct_labor_force / 100)"
    round: 0